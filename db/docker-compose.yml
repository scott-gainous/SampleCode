services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: contoso-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ContosoDev!Passw0rd"   # local dev only — never reuse elsewhere
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'ContosoDev!Passw0rd' -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mssql-data:
